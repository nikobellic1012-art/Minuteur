<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Décompte</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding:2rem;background:#e6edf1;color:#14213d">
<p>Jusqu'à jeudi 1er octobre, 18 h</p>
<h1 id="t" style="font-size:2.2rem">Chargement…</h1>
<noscript><p>Le décompte a besoin de JavaScript : ouvre ce fichier dans Chrome ou Safari.</p></noscript>
<script>
var cible = new Date(2026, 9, 1, 18, 0, 0).getTime();
function maj() {
  var r = Math.floor((cible - Date.now()) / 1000);
  if (r <= 0) { document.getElementById("t").textContent = "Départ de la meilleure des secrétaires"; return; }
  var j = Math.floor(r / 86400), h = Math.floor(r % 86400 / 3600),
      m = Math.floor(r % 3600 / 60), s = r % 60;
  document.getElementById("t").textContent = j + " j " + h + " h " + m + " min " + s + " s";
}
maj();
setInterval(maj, 1000);
</script>
</body>
</html>
